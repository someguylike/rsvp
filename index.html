<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Who’s In This Week?</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css?v=20260609-18" />
  </head>
  <body>
    <main class="shell">
      <section class="panel admin-panel rsvp-panel" aria-labelledby="page-title">
        <div class="heading">
          <p class="eyebrow">Weekly play signup</p>
          <h1 id="page-title">Who’s In This Week?</h1>
        </div>

        <nav class="page-nav" aria-label="Page navigation">
          <input id="page-nav-toggle" class="page-nav-toggle" type="checkbox" />
          <label class="page-nav-button" for="page-nav-toggle" aria-label="Open page menu">☰</label>
          <div class="page-nav-links">
            <a class="active" href="./index.html" aria-current="page">RSVP</a>
            <a href="./roster.html">Members</a>
            <a href="./export.html">Report</a>
            <a href="./admin.html">Admin</a>
          </div>
        </nav>

        <form id="rsvp-form" class="form">
          <div class="field">
            <label for="player-name">Player name</label>
            <input
              id="player-name"
              name="playerName"
              autocomplete="off"
              inputmode="search"
              role="combobox"
              aria-autocomplete="list"
              aria-controls="player-list"
              aria-expanded="false"
              required
              placeholder="Search your name"
            />
            <p id="player-memory" class="player-memory" hidden></p>
            <button id="change-player-button" class="change-player-button" type="button" hidden>
              Change player
            </button>
            <div id="player-list" class="player-list" hidden></div>
          </div>

          <div id="rsvp-details" class="rsvp-details" hidden>
            <fieldset class="field">
              <legend>Date to play</legend>
              <input id="play-date" name="playDate" type="hidden" required />
              <div
                id="date-options"
                class="date-options"
                role="radiogroup"
                aria-label="Date to play"
              ></div>
              <label id="custom-date-field" class="custom-date-field">
                <span>Other date</span>
                <input id="custom-play-date" type="date" />
              </label>
            </fieldset>

            <label class="field">
              <span>Reserved spots</span>
              <select
                id="participant-count"
                name="participantCount"
                required
              >
                <option value="0">Not going</option>
                <option value="1" selected>Just me</option>
                <option value="2">Me + 1</option>
                <option value="3">Me + 2</option>
                <option value="4">Me + 3</option>
                <option value="5">Me + 4</option>
              </select>
            </label>

            <button id="submit-button" type="submit">Submit RSVP</button>
          </div>
          <p id="status" class="status" role="status" aria-live="polite"></p>
          <button id="remove-rsvp-button" class="remove-rsvp-button" type="button" hidden>
            Made a mistake? Remove this RSVP
          </button>
        </form>

        <section id="tally-section" class="tally" aria-labelledby="tally-title" hidden>
          <div class="tally-header">
            <h2 id="tally-title">Joining this date</h2>
            <p id="tally-count">No RSVPs yet</p>
          </div>
          <ul id="tally-list" class="tally-list"></ul>
        </section>

      </section>
    </main>

    <dialog id="override-dialog" class="dialog">
      <form method="dialog" class="dialog-panel">
        <h2>Update existing RSVP?</h2>
        <p class="dialog-copy">
          This player already has an RSVP for this date.
        </p>
        <div class="compare">
          <section>
            <h3>Previous</h3>
            <dl id="previous-rsvp"></dl>
          </section>
          <section>
            <h3>New</h3>
            <dl id="new-rsvp"></dl>
          </section>
        </div>
        <div class="dialog-actions">
          <button id="cancel-override" class="secondary-button" value="cancel">
            Keep previous
          </button>
          <button id="confirm-override" value="confirm">Update RSVP</button>
        </div>
      </form>
    </dialog>

    <script src="./admin-auth.js?v=20260609-3"></script>
    <script src="./app.js?v=20260609-21"></script>
  </body>
</html>
