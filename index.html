<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Who’s In This Week?</title>
    <link rel="stylesheet" href="./styles.css?v=20260605-3" />
  </head>
  <body>
    <main class="shell">
      <section class="panel" aria-labelledby="page-title">
        <div class="heading">
          <p class="eyebrow">Weekly play signup</p>
          <h1 id="page-title">Who’s In This Week?</h1>
        </div>

        <form id="rsvp-form" class="form">
          <div class="field">
            <label for="player-name">Player name</label>
            <input
              id="player-name"
              name="playerName"
              autocomplete="off"
              autofocus
              required
              placeholder="Search your name"
            />
            <div id="player-list" class="player-list" hidden></div>
          </div>

          <fieldset class="field">
            <legend>Date to play</legend>
            <input id="play-date" name="playDate" type="hidden" required />
            <div
              id="date-options"
              class="date-options"
              role="radiogroup"
              aria-label="Date to play"
            ></div>
            <label id="custom-date-field" class="custom-date-field">
              <span>Other date</span>
              <input id="custom-play-date" type="date" />
            </label>
          </fieldset>

          <label class="field">
            <span>Reserved spots</span>
            <select
              id="participant-count"
              name="participantCount"
              aria-describedby="participant-count-help"
              title="0 = not going, 1 = going by yourself, 2-5 = total spots including guests"
              required
            >
              <option value="0">0</option>
              <option value="1" selected>1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
            </select>
            <small id="participant-count-help" class="field-help">
              0 = not going, 1 = going by yourself, 2-5 = total spots including guests.
            </small>
          </label>

          <button id="submit-button" type="submit">Submit RSVP</button>
          <p id="status" class="status" role="status" aria-live="polite"></p>
        </form>

        <section class="tally" aria-labelledby="tally-title">
          <div class="tally-header">
            <h2 id="tally-title">Joining this date</h2>
            <p id="tally-count">No RSVPs yet</p>
          </div>
          <ul id="tally-list" class="tally-list"></ul>
        </section>

        <footer class="page-footer">
          <a href="./export.html">Monthly export</a>
        </footer>
      </section>
    </main>

    <dialog id="override-dialog" class="dialog">
      <form method="dialog" class="dialog-panel">
        <h2>Update existing RSVP?</h2>
        <p class="dialog-copy">
          This player already has an RSVP for this date.
        </p>
        <div class="compare">
          <section>
            <h3>Previous</h3>
            <dl id="previous-rsvp"></dl>
          </section>
          <section>
            <h3>New</h3>
            <dl id="new-rsvp"></dl>
          </section>
        </div>
        <div class="dialog-actions">
          <button id="cancel-override" class="secondary-button" value="cancel">
            Keep previous
          </button>
          <button id="confirm-override" value="confirm">Update RSVP</button>
        </div>
      </form>
    </dialog>

    <script src="./app.js?v=20260605-1"></script>
  </body>
</html>
