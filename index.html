<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Play RSVP</title>
    <link rel="stylesheet" href="./styles.css?v=20260602-5" />
  </head>
  <body>
    <main class="shell">
      <section class="panel" aria-labelledby="page-title">
        <div class="heading">
          <p class="eyebrow">Weekly play signup</p>
          <h1 id="page-title">RSVP for the next session</h1>
        </div>

        <form id="rsvp-form" class="form">
          <label class="field">
            <span>Player name</span>
            <input
              id="player-name"
              name="playerName"
              list="player-list"
              autocomplete="off"
              required
              placeholder="Search your name"
            />
            <datalist id="player-list"></datalist>
          </label>

          <fieldset class="field">
            <legend>Date to play</legend>
            <input id="play-date" name="playDate" type="hidden" required />
            <div
              id="date-options"
              class="date-options"
              role="radiogroup"
              aria-label="Date to play"
            ></div>
            <label id="custom-date-field" class="custom-date-field">
              <span>Other date</span>
              <input id="custom-play-date" type="date" />
            </label>
          </fieldset>

          <fieldset class="field">
            <legend>Vote</legend>
            <div class="segmented" role="radiogroup" aria-label="Vote">
              <label>
                <input type="radio" name="vote" value="Yes" checked />
                <span>Yes</span>
              </label>
              <label>
                <input type="radio" name="vote" value="No" />
                <span>No</span>
              </label>
            </div>
          </fieldset>

          <label class="field">
            <span>Guests</span>
            <input
              id="guest-count"
              name="guestCount"
              type="number"
              min="0"
              max="20"
              step="1"
              inputmode="numeric"
              value="0"
              required
            />
          </label>

          <button id="submit-button" type="submit">Submit RSVP</button>
          <p id="status" class="status" role="status" aria-live="polite"></p>
        </form>

        <section class="tally" aria-labelledby="tally-title">
          <div class="tally-header">
            <h2 id="tally-title">Joining this date</h2>
            <p id="tally-count">No RSVPs yet</p>
          </div>
          <ul id="tally-list" class="tally-list"></ul>
        </section>
      </section>
    </main>

    <dialog id="override-dialog" class="dialog">
      <form method="dialog" class="dialog-panel">
        <h2>Update existing RSVP?</h2>
        <p class="dialog-copy">
          This player already has an RSVP for this date.
        </p>
        <div class="compare">
          <section>
            <h3>Previous</h3>
            <dl id="previous-rsvp"></dl>
          </section>
          <section>
            <h3>New</h3>
            <dl id="new-rsvp"></dl>
          </section>
        </div>
        <div class="dialog-actions">
          <button id="cancel-override" class="secondary-button" value="cancel">
            Keep previous
          </button>
          <button id="remove-rsvp" class="danger-button" value="remove">
            Remove RSVP
          </button>
          <button id="confirm-override" value="confirm">Update RSVP</button>
        </div>
      </form>
    </dialog>

    <script src="./app.js?v=20260602-13"></script>
  </body>
</html>
