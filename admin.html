<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Update Attendance</title>
    <link rel="stylesheet" href="./styles.css?v=20260605-10" />
  </head>
  <body>
    <main class="shell">
      <section class="panel admin-panel" aria-labelledby="page-title">
        <div class="heading">
          <p class="eyebrow">Admin</p>
          <h1 id="page-title">Update Attendance</h1>
        </div>

        <nav class="page-nav" aria-label="Page navigation">
          <a href="./index.html">RSVP</a>
          <a class="active" href="./admin.html" aria-current="page">Attendance</a>
          <a href="./roster.html">Members</a>
          <a href="./export.html">Export</a>
        </nav>

        <form id="admin-form" class="form">
          <div class="admin-controls">
            <label class="field">
              <span>Month</span>
              <input id="roster-month" name="month" type="month" required />
            </label>

            <label class="field">
              <span>Find players</span>
              <input
                id="player-search"
                autocomplete="off"
                placeholder="Search roster"
                type="search"
              />
            </label>
          </div>

          <div class="admin-roster-actions">
            <p id="change-count" class="status">No changes</p>
            <button id="save-button" type="submit" disabled>Save Changes</button>
          </div>

          <p id="status" class="status" role="status" aria-live="polite"></p>
        </form>

        <section class="admin-preview">
          <div class="preview-heading">
            <h2>Month Roster</h2>
            <p id="month-total">Loading...</p>
          </div>
          <p class="field-help">
            Each cell is the total attendance for that player on that date:
            0 = not attending, 1 = player only, 2-5 = player plus guests.
          </p>
          <div class="table-wrap roster-edit-wrap">
            <table id="roster-table" class="export-table roster-edit-table"></table>
          </div>
        </section>

      </section>
    </main>

    <script src="./admin.js?v=20260605-5"></script>
  </body>
</html>
