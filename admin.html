<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin</title>
    <link rel="stylesheet" href="./styles.css?v=20260605-21" />
  </head>
  <body>
    <main class="shell">
      <section class="panel admin-panel" aria-labelledby="page-title">
        <div class="heading">
          <h1 id="page-title">Admin</h1>
        </div>

        <nav class="page-nav" aria-label="Page navigation">
          <input id="page-nav-toggle" class="page-nav-toggle" type="checkbox" />
          <label class="page-nav-button" for="page-nav-toggle" aria-label="Open page menu">☰</label>
          <div class="page-nav-links">
            <a href="./index.html">RSVP</a>
            <a href="./roster.html">Members</a>
            <a href="./export.html">Report</a>
            <a class="active" href="./admin.html" aria-current="page">Admin</a>
          </div>
        </nav>

        <section id="admin-login-panel" class="auth-panel">
          <form id="admin-login-form" class="auth-form">
            <label class="field">
              <span>Admin password</span>
              <input
                id="admin-password"
                autocomplete="current-password"
                type="password"
                required
              />
            </label>
            <button id="admin-login-button" type="submit">Log In</button>
          </form>
          <p id="admin-login-status" class="status" role="status" aria-live="polite"></p>
        </section>

        <div id="admin-content" hidden>
          <div class="auth-session">
            <p class="status success">Admin access enabled</p>
            <button id="admin-logout-button" class="secondary-button" type="button">
              Log Out
            </button>
          </div>

          <form id="admin-form" class="form">
            <div class="admin-controls">
              <label class="field">
                <span>Month</span>
                <input id="roster-month" name="month" type="month" required />
              </label>

              <label class="field">
                <span>Find players</span>
                <input
                  id="player-search"
                  autocomplete="off"
                  placeholder="Search roster"
                  type="search"
                />
              </label>
            </div>

            <div class="admin-roster-actions">
              <p id="change-count" class="status">No changes</p>
              <button id="save-button" type="submit" disabled>Save Changes</button>
            </div>

            <p id="status" class="status" role="status" aria-live="polite"></p>
          </form>

          <section class="admin-preview">
            <div class="preview-heading">
              <h2>Month Roster</h2>
              <p id="month-total">Loading...</p>
            </div>
            <p class="field-help">
              Each cell is the total attendance for that player on that date:
              0 = not attending, 1 = player only, 2-5 = player plus guests.
            </p>
            <div class="table-wrap roster-edit-wrap">
              <table id="roster-table" class="export-table roster-edit-table"></table>
            </div>
          </section>
        </div>

      </section>
    </main>

    <script src="./admin.js?v=20260605-10"></script>
  </body>
</html>
