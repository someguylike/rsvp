<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manage Roster</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css?v=20260609-12" />
  </head>
  <body>
    <main class="shell">
      <section class="panel admin-panel" aria-labelledby="page-title">
        <div class="heading">
          <p id="admin-eyebrow" class="eyebrow" hidden>Admin</p>
          <h1 id="page-title">Manage Roster</h1>
        </div>

        <nav class="page-nav" aria-label="Page navigation">
          <input id="page-nav-toggle" class="page-nav-toggle" type="checkbox" />
          <label class="page-nav-button" for="page-nav-toggle" aria-label="Open page menu">☰</label>
          <div class="page-nav-links">
            <a href="./index.html">RSVP</a>
            <a class="active" href="./roster.html" aria-current="page">Members</a>
            <a href="./export.html">Report</a>
            <a href="./admin.html">Admin</a>
          </div>
        </nav>

        <form id="roster-form" class="form">
          <div class="roster-form-grid">
            <label class="field">
              <span>Name</span>
              <input
                id="member-name"
                name="playerName"
                autocomplete="off"
                list="member-name-list"
                required
                placeholder="Search existing or type a new name"
                title="Search existing members or type a new name to add one"
              />
              <datalist id="member-name-list"></datalist>
            </label>

            <label class="field">
              <span>Venmo</span>
              <input
                id="venmo"
                name="venmo"
                autocomplete="off"
                placeholder="@username"
                title="Used for payment collection"
                required
              />
            </label>

            <label class="field">
              <span>Facebook Profile</span>
              <input
                id="messenger"
                name="messenger"
                autocomplete="off"
                placeholder="Facebook profile URL"
                title="Used to identify and contact the member"
                required
              />
            </label>

            <label class="field">
              <span>Cellphone</span>
              <input
                id="cellphone"
                name="cellphone"
                autocomplete="off"
                inputmode="tel"
                placeholder="Optional"
                title="Optional phone number. Hidden in the table by default."
              />
            </label>

          </div>

          <div class="admin-roster-actions">
            <p id="status" class="status" role="status" aria-live="polite"></p>
            <button id="save-button" type="submit">Save Member</button>
          </div>
        </form>

        <section class="admin-preview">
          <div class="preview-heading">
            <h2>Members</h2>
            <p id="member-count">Loading...</p>
          </div>
          <label class="field roster-search-field">
            <span>Find member</span>
            <input
              id="member-search"
              autocomplete="off"
              placeholder="Search by name, Venmo, or Facebook"
              type="search"
            />
          </label>
          <div class="table-wrap compact-table-wrap">
            <table id="member-table" class="export-table roster-member-table"></table>
          </div>
        </section>

      </section>
    </main>

    <script src="./admin-auth.js?v=20260609-2"></script>
    <script src="./roster.js?v=20260609-10"></script>
  </body>
</html>
