<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RSVP Rules Tests</title>
    <style>
      body {
        color: #1f2937;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        line-height: 1.5;
        margin: 2rem;
      }

      h1 {
        font-size: 1.5rem;
        margin: 0 0 1rem;
      }

      #summary {
        font-weight: 700;
        margin-bottom: 1rem;
      }

      .pass {
        color: #047857;
      }

      .fail {
        color: #b91c1c;
      }

      li {
        margin: 0.25rem 0;
      }
    </style>
  </head>
  <body>
    <h1>RSVP Rules Tests</h1>
    <p id="summary">Running...</p>
    <ol id="results"></ol>

    <script src="../rsvp-rules.js"></script>
    <script>
      (function () {
        const results = document.querySelector("#results");
        const summary = document.querySelector("#summary");
        const tests = [];

        function test(name, fn) {
          tests.push({ name, fn });
        }

        function assertEqual(actual, expected) {
          if (!Object.is(actual, expected)) {
            throw new Error(`Expected ${expected}, received ${actual}`);
          }
        }

        function assertDateValue(actual, expected) {
          assertEqual(window.RsvpRules.formatDate(actual), expected);
        }

        test("start of month uses the first day of the current month", () => {
          assertEqual(
            window.RsvpRules.getStartOfMonthValue(
              new Date(2026, 5, 26, 19, 30),
            ),
            "2026-06-01",
          );
        });

        test("positive RSVP backfill allows dates earlier this month", () => {
          assertEqual(
            window.RsvpRules.isDateInCurrentMonthOrLater(
              "2026-06-01",
              new Date(2026, 5, 26, 19, 30),
            ),
            true,
          );
        });

        test("positive RSVP backfill blocks dates before this month", () => {
          assertEqual(
            window.RsvpRules.isDateInCurrentMonthOrLater(
              "2026-05-31",
              new Date(2026, 5, 26, 19, 30),
            ),
            false,
          );
        });

        test("positive RSVP backfill allows future months", () => {
          assertEqual(
            window.RsvpRules.isDateInCurrentMonthOrLater(
              "2026-07-01",
              new Date(2026, 5, 26, 19, 30),
            ),
            true,
          );
        });

        test("unvote lock is midnight for a 6AM play start", () => {
          assertDateValue(
            window.RsvpRules.getUnvoteLockTime("2026-06-28"),
            "2026-06-28",
          );
          assertEqual(
            window.RsvpRules.getUnvoteLockTime("2026-06-28").getHours(),
            0,
          );
        });

        test("unvote is allowed before midnight cutoff", () => {
          assertEqual(
            window.RsvpRules.isUnvoteLocked(
              "2026-06-28",
              new Date(2026, 5, 27, 23, 59, 59),
            ),
            false,
          );
        });

        test("unvote is blocked at midnight cutoff", () => {
          assertEqual(
            window.RsvpRules.isUnvoteLocked(
              "2026-06-28",
              new Date(2026, 5, 28, 0, 0, 0),
            ),
            true,
          );
        });

        test("unvote is blocked after the play date", () => {
          assertEqual(
            window.RsvpRules.isUnvoteLocked(
              "2026-06-01",
              new Date(2026, 5, 26, 19, 30),
            ),
            true,
          );
        });

        let passed = 0;
        tests.forEach(({ name, fn }) => {
          const item = document.createElement("li");
          try {
            fn();
            passed += 1;
            item.className = "pass";
            item.textContent = `PASS ${name}`;
          } catch (error) {
            item.className = "fail";
            item.textContent = `FAIL ${name}: ${error.message}`;
          }
          results.append(item);
        });

        summary.className = passed === tests.length ? "pass" : "fail";
        summary.textContent = `${passed} of ${tests.length} tests passed.`;
      })();
    </script>
  </body>
</html>
