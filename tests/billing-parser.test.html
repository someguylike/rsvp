<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Billing Parser Tests</title>
    <style>
      body {
        color: #1f2937;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        line-height: 1.5;
        margin: 2rem;
      }

      h1 {
        font-size: 1.5rem;
        margin: 0 0 1rem;
      }

      #summary {
        font-weight: 700;
        margin-bottom: 1rem;
      }

      .pass {
        color: #047857;
      }

      .fail {
        color: #b91c1c;
      }

      li {
        margin: 0.25rem 0;
      }
    </style>
  </head>
  <body>
    <h1>Billing Parser Tests</h1>
    <p id="summary">Running...</p>
    <ol id="results"></ol>

    <script src="../billing-parser.js"></script>
    <script>
      (async function () {
        const results = document.querySelector("#results");
        const summary = document.querySelector("#summary");
        const tests = [];

        function test(name, fn) {
          tests.push({ name, fn });
        }

        function assertEqual(actual, expected) {
          if (!Object.is(actual, expected)) {
            throw new Error(`Expected ${expected}, received ${actual}`);
          }
        }

        function assertClose(actual, expected) {
          if (Math.abs(actual - expected) > 0.001) {
            throw new Error(`Expected ${expected}, received ${actual}`);
          }
        }

        const response = await fetch("../data/04_2026.csv", {
          cache: "no-store",
        });
        if (!response.ok) {
          throw new Error("Could not load April billing fixture");
        }
        const csv = await response.text();
        const model = window.BillingParser.parseFinalizedBillingCsv(csv, {
          year: 2026,
          month: 4,
        });
        const mayResponse = await fetch("../data/05_2026.csv", {
          cache: "no-store",
        });
        if (!mayResponse.ok) {
          throw new Error("Could not load May billing fixture");
        }
        const mayCsv = await mayResponse.text();
        const mayModel = window.BillingParser.parseFinalizedBillingCsv(mayCsv, {
          year: 2026,
          month: 5,
        });

        test("finds the member header row", () => {
          assertEqual(model.rows.memberHeader, 17);
        });

        test("detects April attendance date columns", () => {
          assertEqual(model.columns.dateColumns.length, 12);
          assertEqual(model.columns.dateColumns[0].label, "04/02");
          assertEqual(model.columns.dateColumns[11].label, "04/03");
        });

        test("detects May single-digit attendance date columns", () => {
          const backfill =
            window.BillingParser.buildFinalizedBillingBackfill(mayModel);
          assertEqual(mayModel.columns.dateColumns.length, 18);
          assertEqual(mayModel.columns.dateColumns[0].label, "05/01");
          assertEqual(mayModel.columns.dateColumns[1].label, "5/3");
          assertEqual(backfill.attendanceRsvps.length, 141);
        });

        test("parses audit and totals", () => {
          assertEqual(model.auditStatus, "CORRECT");
          assertClose(model.totals.expectedExpense, 1601.59);
          assertClose(model.totals.memberPaid, 1601.59);
          assertClose(model.totals.birdieFee, 595);
          assertClose(model.totals.birdieCostPerParticipation, 3.37);
          assertClose(model.totals.courtFee, 1006.59);
        });

        test("detects finalized member rows", () => {
          assertEqual(model.members.length, 45);
          assertEqual(
            model.members.filter(
              (member) => member.netBalance && member.netBalance !== 0,
            ).length,
            33,
          );
        });

        test("parses daily court cost rows", () => {
          const april5 = model.dailyCosts.find((day) => day.label === "04/05");
          assertEqual(april5.participation, 19);
          assertClose(april5.courtFee, 193.41);
          assertClose(april5.courtFeePerPlayer, 10.18);
        });

        test("parses member attendance and net balance", () => {
          const bao = model.members.find((member) => member.name === "Bao Ta");
          assertEqual(bao.totalSpots, 5);
          assertClose(bao.netBalance, 38.29);
          assertClose(bao.birdieFee, 16.86);
          assertClose(bao.courtFee, 21.44);
        });

        test("parses paid credits from unlabeled trailing column", () => {
          const hoan = model.members.find(
            (member) => member.name === "Hoan Nguyen",
          );
          const thanh = model.members.find(
            (member) => member.name === "Thanh Nguyen",
          );
          assertClose(hoan.paidCredits, -1684.25);
          assertClose(thanh.paidCredits, -22.34);
        });

        test("builds finalized billing backfill rows", () => {
          const backfill = window.BillingParser.buildFinalizedBillingBackfill(model);
          const hoanCredit = backfill.creditAdjustments.find(
            (entry) => entry.playerName === "Hoan Nguyen",
          );
          const thanhCourtTotal = backfill.courtBlocks
            .filter((block) => block.paidBy === "Thanh Nguyen")
            .reduce((sum, block) => sum + block.amount, 0);
          const hoanCourtTotal = backfill.courtBlocks
            .filter((block) => block.paidBy === "Hoan Nguyen")
            .reduce((sum, block) => sum + block.amount, 0);

          assertEqual(backfill.month, "2026-04");
          assertEqual(backfill.courtBlocks.length, 14);
          assertEqual(backfill.birdiePurchases.length, 1);
          assertEqual(backfill.attendanceRsvps.length > 0, true);
          assertClose(thanhCourtTotal, 22.34);
          assertClose(hoanCourtTotal, 984.25);
          assertClose(backfill.birdiePurchases[0].tubes, 17);
          assertClose(backfill.birdiePurchases[0].amount, 595);
          assertClose(backfill.birdiePurchases[0].unitPrice, 35);
          assertEqual(backfill.birdiePurchases[0].batch, "Lingmei 90 Pro");
          assertClose(hoanCredit.amount, 700);
        });

        test("parses April birdie inventory from row 18", () => {
          const backfill = window.BillingParser.buildFinalizedBillingBackfill(model);
          assertClose(backfill.birdieInventory.startTubes, 4.5);
          assertClose(backfill.birdieInventory.usedTubes, 17);
          assertClose(backfill.birdieInventory.endTubes, 52.5);
          assertEqual(backfill.birdieInventoryPurchases.length, 5);
          assertClose(
            backfill.birdieInventoryPurchases.reduce(
              (sum, purchase) => sum + purchase.tubes,
              0,
            ),
            69.5,
          );
        });

        test("defaults unnamed birdie inventory purchases to Nam Pham", () => {
          const backfill = window.BillingParser.buildFinalizedBillingBackfill(model);
          const april15 = backfill.birdieInventoryPurchases.find(
            (purchase) => purchase.date === "2026-04-15",
          );
          const april26 = backfill.birdieInventoryPurchases.find(
            (purchase) => purchase.date === "2026-04-26",
          );
          assertClose(april15.unitPrice, 38.6);
          assertEqual(april15.paidBy, "Nam Pham");
          assertEqual(april15.batch, "Lingmei 90");
          assertEqual(april26.paidBy, "Hoan Nguyen");
        });

        test("preserves formula and inventory notes", () => {
          assertEqual(
            model.notes.birdieFormula.includes("How many tubes we have used"),
            true,
          );
          assertEqual(model.notes.inventory.includes("Lingmei"), true);
        });

        const bookingExport = `
          Active
          Cancelled
          29 Bookings Found
          Early Access - Renton
          Sun, Aug 2nd, 6:00 AM - 9:00 AM
          Hoan Nguyen, Thanh V Nguyen
          746348#
          Renton 10
          Details
          Early Access - Renton
          Sun, Aug 2nd, 8:00 AM - 9:00 AM
          Hoan Nguyen, Thanh V Nguyen
          146592#
          Renton 11
          Details
          Early Access - Bellevue
          Tue, Aug 4th, 6:00 AM - 7:30 AM
          Hoan Nguyen, Thanh V Nguyen, Danh Nguyen, Duy V Nguyen
          822768#
          Bellevue 8
          Details
        `;
        const parsedBookings = window.BillingParser.parseCourtBookingExport(
          bookingExport,
          {
            year: 2026,
            players: ["Hoan Nguyen", "Thanh Nguyen", "Danh Nguyen", "Duy Nguyen"],
          },
        );

        test("parses CourtReserve booking list text", () => {
          assertEqual(parsedBookings.bookings.length, 3);
          assertEqual(parsedBookings.bookings[0].date, "2026-08-02");
          assertEqual(parsedBookings.bookings[0].startTime, "06:00");
          assertEqual(parsedBookings.bookings[0].durationHours, 3);
          assertEqual(parsedBookings.bookings[0].reference, "746348");
          assertEqual(parsedBookings.bookings[0].court, "Renton 10");
          assertEqual(parsedBookings.bookings[0].paidBy, "Hoan Nguyen");
          assertClose(parsedBookings.bookings[0].amount, 82.89);
          assertEqual(parsedBookings.bookings[0].amountSource, "calculated");
          assertClose(parsedBookings.bookings[2].amount, 22.34);
        });

        test("maps CourtReserve middle initials to roster names", () => {
          assertEqual(
            window.BillingParser.resolveBookingPayer("Thanh V Nguyen", [
              "Thanh Nguyen",
              "Hoan Nguyen",
            ]),
            "Thanh Nguyen",
          );
        });

        test("reads a page total from saved booking HTML", () => {
          const html = `
            <html><body><article>
              <h3>Early Access - Bellevue</h3>
              <div>Tue, Aug 4th, 6:00 AM - 7:30 AM</div>
              <div>Hoan Nguyen, Thanh V Nguyen</div>
              <div>822768#</div><div>Bellevue 8</div>
              <div>Total $24.50</div>
            </article></body></html>
          `;
          const result = window.BillingParser.parseCourtBookingExport(html, {
            year: 2026,
            players: ["Hoan Nguyen", "Thanh Nguyen"],
          });
          assertEqual(result.bookings.length, 1);
          assertClose(result.bookings[0].amount, 24.5);
          assertEqual(result.bookings[0].amountSource, "export");
        });

        test("reads a reservation audit from XML", () => {
          const xml = `<?xml version="1.0"?>
            <reservations><reservation>
              <event>Early Access - Renton</event>
              <time>Sun, Aug 2nd, 6:00 AM - 9:00 AM</time>
              <members>Hoan Nguyen, Thanh V Nguyen</members>
              <number>746348#</number>
              <court>Renton 10</court>
            </reservation></reservations>`;
          const result = window.BillingParser.parseCourtBookingExport(xml, {
            year: 2026,
            players: ["Hoan Nguyen", "Thanh Nguyen"],
          });
          assertEqual(result.bookings.length, 1);
          assertEqual(result.bookings[0].court, "Renton 10");
          assertEqual(result.bookings[0].paidBy, "Hoan Nguyen");
        });

        const transactionRows = [
          ["Date", "Type", "Amount", "Unpaid Amount", "Paid Date", "Payment Type", "Category", "Date/Time", "Member", "Instructor(s)"],
          ["6/1/2026", "Payment", "$55.25", "$0.00", "6/1/2026", "Credit Card", "Early Access - Renton", "Sun, Jun 7th, 7a - 9a", "Hoan Nguyen", ""],
          ["6/1/2026", "Fee", "$55.25", "$0.00", "6/1/2026", "Credit Card", "Early Access - Renton", "Sun, Jun 7th, 7a - 9a", "Hoan Nguyen", ""],
          ["6/6/2026", "Refund - Account Credit", "$55.25", "$0.00", "6/6/2026", "Account Credit", "Early Access - Renton", "Sun, Jun 7th, 7a - 9a", "Hoan Nguyen", ""],
          ["6/8/2026", "Payment", "$27.63", "$0.00", "6/8/2026", "Credit Card", "Early Access - Renton", "Sun, Jun 14th, 8a - 9a", "Hoan Nguyen", ""],
          ["6/8/2026", "Fee", "$27.63", "$0.00", "6/8/2026", "Credit Card", "Early Access - Renton", "Sun, Jun 14th, 8a - 9a", "Hoan Nguyen", ""],
          ["6/8/2026", "Payment", "$27.63", "$0.00", "6/8/2026", "Credit Card", "Early Access - Renton", "Sun, Jun 14th, 8a - 9a", "Hoan Nguyen", ""],
          ["6/8/2026", "Fee", "$27.63", "$0.00", "6/8/2026", "Credit Card", "Early Access - Renton", "Sun, Jun 14th, 8a - 9a", "Hoan Nguyen", ""],
          ["6/8/2026", "Payment", "$57.41", "$0.00", "6/8/2026", "Credit Card", "Early Access - Renton", "Sun, Jun 14th, 6a - 9a", "Hoan Nguyen", ""],
          ["6/8/2026", "Payment (AC)", "$25.47", "$0.00", "6/8/2026", "Account Credit", "Early Access - Renton", "Sun, Jun 14th, 6a - 9a", "Hoan Nguyen", ""],
          ["6/8/2026", "Fee", "$82.88", "$0.00", "6/8/2026", "Credit Card", "Early Access - Renton", "Sun, Jun 14th, 6a - 9a", "Hoan Nguyen", ""],
          ["6/28/2026", "Payment", "$27.63", "$0.00", "6/28/2026", "Credit Card", "Early Access - Renton", "Sun, Jul 5th, 8a - 9a", "Hoan Nguyen", ""],
          ["6/28/2026", "Fee", "$27.63", "$0.00", "6/28/2026", "Credit Card", "Early Access - Renton", "Sun, Jul 5th, 8a - 9a", "Hoan Nguyen", ""],
        ];
        const parsedTransactions =
          window.BillingParser.parseCourtReserveTransactionRows(transactionRows, {
            year: 2026,
            players: ["Hoan Nguyen"],
          });

        test("reconciles CourtReserve fees, payments, credits, and refunds", () => {
          assertEqual(parsedTransactions.bookings.length, 4);
          assertEqual(parsedTransactions.canceled.length, 1);
          assertClose(parsedTransactions.canceled[0].grossAmount, 55.25);
          assertClose(parsedTransactions.canceled[0].refundAmount, 55.25);
          const duplicateCourts = parsedTransactions.bookings.filter(
            (booking) => booking.date === "2026-06-14" && booking.startTime === "08:00",
          );
          const splitPayment = parsedTransactions.bookings.find(
            (booking) => booking.date === "2026-06-14" && booking.startTime === "06:00",
          );
          assertEqual(duplicateCourts.length, 2);
          assertEqual(
            duplicateCourts.every((booking) => booking.courts === 1),
            true,
          );
          assertClose(
            duplicateCourts.reduce((sum, booking) => sum + booking.amount, 0),
            55.26,
          );
          assertClose(splitPayment.paymentAmount, 82.88);
          assertEqual(splitPayment.paymentTypes.includes("Account Credit"), true);
          assertEqual(splitPayment.reviewReasons.length, 0);
        });

        test("keeps the replacement June 7 court after the earlier booking is refunded", () => {
          const june7Rows = [
            transactionRows[0],
            ["6/6/2026", "Refund - Account Credit", "$55.25", "$0.00", "6/6/2026", "Account Credit", "Early Access - Renton", "Sun, Jun 7th,\u00a0 7a - 9a", "Hoan Nguyen", ""],
            ["6/4/2026", "Payment", "$27.63", "$0.00", "6/4/2026", "Credit Card", "Early Access - Renton", "Sun, Jun 7th,\u00a0 8a - 9a", "Hoan Nguyen", ""],
            ["6/4/2026", "Fee", "$27.63", "$0.00", "6/4/2026", "Credit Card", "Early Access - Renton", "Sun, Jun 7th,\u00a0 8a - 9a", "Hoan Nguyen", ""],
            ["6/1/2026", "Payment", "$27.63", "$0.00", "6/1/2026", "Credit Card", "Early Access - Renton", "Sun, Jun 7th,\u00a0 8a - 9a", "Hoan Nguyen", ""],
            ["6/1/2026", "Fee", "$27.63", "$0.00", "6/1/2026", "Credit Card", "Early Access - Renton", "Sun, Jun 7th,\u00a0 8a - 9a", "Hoan Nguyen", ""],
            ["6/1/2026", "Payment", "$55.25", "$0.00", "6/1/2026", "Credit Card", "Early Access - Renton", "Sun, Jun 7th,\u00a0 7a - 9a", "Hoan Nguyen", ""],
            ["6/1/2026", "Fee", "$55.25", "$0.00", "6/1/2026", "Credit Card", "Early Access - Renton", "Sun, Jun 7th,\u00a0 7a - 9a", "Hoan Nguyen", ""],
            ["6/1/2026", "Payment", "$82.88", "$0.00", "6/1/2026", "Credit Card", "Early Access - Renton", "Sun, Jun 7th,\u00a0 6a - 9a", "Hoan Nguyen", ""],
            ["6/1/2026", "Fee", "$82.88", "$0.00", "6/1/2026", "Credit Card", "Early Access - Renton", "Sun, Jun 7th,\u00a0 6a - 9a", "Hoan Nguyen", ""],
          ];
          const result = window.BillingParser.parseCourtReserveTransactionRows(
            june7Rows,
            { year: 2026, players: ["Hoan Nguyen"] },
          );
          const sixToNine = result.bookings.find(
            (booking) => booking.startTime === "06:00",
          );
          const eightToNine = result.bookings.filter(
            (booking) => booking.startTime === "08:00",
          );

          assertEqual(result.bookings.length, 3);
          assertEqual(
            result.bookings.reduce((sum, booking) => sum + booking.courts, 0),
            3,
          );
          assertEqual(sixToNine.courts, 1);
          assertClose(sixToNine.amount, 82.88);
          assertEqual(eightToNine.length, 2);
          assertEqual(
            eightToNine.every(
              (booking) =>
                booking.courts === 1 &&
                booking.feeCount === 1 &&
                Math.abs(booking.amount - 27.63) < 0.001,
            ),
            true,
          );
          assertEqual(
            eightToNine.every((booking) => booking.sourceRows.length === 2),
            true,
          );
          assertClose(
            result.bookings.reduce((sum, booking) => sum + booking.amount, 0),
            138.14,
          );
          assertEqual(result.canceled.length, 1);
          assertEqual(result.canceled[0].startTime, "07:00");
          assertClose(result.canceled[0].grossAmount, 55.25);
          assertClose(result.canceled[0].refundAmount, 55.25);
          assertEqual(
            result.bookings.every((booking) => booking.reviewReasons.length === 0),
            true,
          );
        });

        test("uses the play date instead of the transaction date", () => {
          const july = parsedTransactions.bookings.find(
            (booking) => booking.date === "2026-07-05",
          );
          assertEqual(Boolean(july), true);
          assertEqual(july.startTime, "08:00");
        });

        test("flags partial refunds for review", () => {
          const result = window.BillingParser.parseCourtReserveTransactionRows(
            [
              transactionRows[0],
              ["6/1/2026", "Payment", "$29.78", "$0.00", "6/1/2026", "Credit Card", "Early Access - Bellevue", "Tue, Jun 2nd, 6a - 8a", "Hoan Nguyen", ""],
              ["6/1/2026", "Fee", "$29.78", "$0.00", "6/1/2026", "Credit Card", "Early Access - Bellevue", "Tue, Jun 2nd, 6a - 8a", "Hoan Nguyen", ""],
              ["6/2/2026", "Refund - Account Credit", "$10.00", "$0.00", "6/2/2026", "Account Credit", "Early Access - Bellevue", "Tue, Jun 2nd, 6a - 8a", "Hoan Nguyen", ""],
            ],
            { year: 2026, players: ["Hoan Nguyen"] },
          );
          assertClose(result.bookings[0].amount, 19.78);
          assertEqual(result.bookings[0].reviewReasons.length > 0, true);
        });

        let passed = 0;
        tests.forEach(({ name, fn }) => {
          const item = document.createElement("li");
          try {
            fn();
            passed += 1;
            item.className = "pass";
            item.textContent = `PASS ${name}`;
          } catch (error) {
            item.className = "fail";
            item.textContent = `FAIL ${name}: ${error.message}`;
          }
          results.append(item);
        });

        summary.className = passed === tests.length ? "pass" : "fail";
        summary.textContent = `${passed} of ${tests.length} tests passed.`;
      })().catch((error) => {
        const summary = document.querySelector("#summary");
        summary.className = "fail";
        summary.textContent = error.message;
      });
    </script>
  </body>
</html>
