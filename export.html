<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RSVP Export</title>
    <link rel="stylesheet" href="./styles.css?v=20260602-14" />
  </head>
  <body>
    <main class="shell">
      <section class="panel admin-panel" aria-labelledby="page-title">
        <div class="heading">
          <p class="eyebrow">Roster export</p>
          <h1 id="page-title">Monthly Roster Export</h1>
        </div>

        <form id="export-form" class="form">
          <label id="month-field" class="field">
            <span>Month</span>
            <input id="export-month" name="month" type="month" required />
          </label>

          <button id="export-button" type="submit">Export Month</button>
          <p id="status" class="status" role="status" aria-live="polite"></p>
          <p id="share-status" class="status" hidden></p>
        </form>

        <section id="heatmap-section" class="admin-preview" hidden>
          <div class="preview-heading">
            <h2>Group Heatmap</h2>
            <p id="heatmap-note"></p>
          </div>
          <div id="group-heatmap" class="heatmap-grid"></div>
        </section>

        <section id="filter-section" class="admin-preview filter-panel" hidden>
          <label class="field">
            <span>Player</span>
            <select id="player-filter"></select>
          </label>
        </section>

        <section id="individual-section" class="admin-preview" hidden>
          <div class="preview-heading">
            <h2>Overview</h2>
            <p id="individual-note"></p>
          </div>
          <div class="table-wrap compact-table-wrap">
            <table id="individual-table" class="export-table heatmap-table"></table>
          </div>
        </section>

        <section id="audit-section" class="admin-preview" hidden>
          <div class="preview-heading">
            <h2>Participant Audit</h2>
            <p id="audit-note"></p>
          </div>
          <div class="table-wrap compact-table-wrap">
            <table id="audit-table" class="export-table audit-table"></table>
          </div>
        </section>
      </section>
    </main>

    <script src="./export.js?v=20260604-1"></script>
  </body>
</html>
